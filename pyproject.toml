[project]
name = "image-detection-backend"
version = "4.0.0"
description = "FastAPI service for image detection and analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "tensorflow==2.16.1",
  "pillow>=10.2.0",
  "numpy>=1.26.0",
  "reportlab>=4.1.0",
  "matplotlib>=3.8.0",
  "scikit-learn>=1.4.0",
  "python-dotenv>=1.0.1"
]

[tool.vercel]
entrypoint = "backend.app.main:app"
